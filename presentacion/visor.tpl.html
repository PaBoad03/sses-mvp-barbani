<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&family=Funnel+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
/* visor: cada diapositiva es un lienzo de 1920x1080 escalado a la ventana */
html,body{margin:0;height:100%;background:#0f181c;overflow:hidden;font-family:"Funnel Sans","Segoe UI",system-ui,sans-serif}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.slot{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform-origin:center;display:none}
.slot.on{display:block}
.slot>section{width:1920px;height:1080px;box-sizing:border-box;position:relative;overflow:hidden}
.slot h1,.slot h2,.slot h3,.slot p{margin:0}
.hud{position:fixed;left:16px;bottom:12px;color:#9ea7ab;font-size:14px;z-index:5;user-select:none}
.notes{position:fixed;left:0;right:0;bottom:0;background:rgba(15,24,28,.94);color:#f7f9fa;font-size:18px;line-height:1.45;padding:16px 24px 40px;z-index:4;display:none}
.notes.on{display:block}
@media print{*{animation:none!important;transition:none!important}html,body{overflow:visible;background:#fff;height:auto}.stage{position:static;display:block}.slot{display:block!important;position:relative;left:auto;top:auto;transform:none!important;page-break-after:always;break-after:page}.hud,.notes{display:none!important}@page{size:1920px 1080px;margin:0}}
{{CSS}}
</style></head><body>
<div class="stage">{{SLIDES}}</div>
<div class="notes" id="notes"></div>
<div class="hud" id="hud"></div>
<script>
(function(){
  const s=[...document.querySelectorAll('.slot')], hud=document.getElementById('hud'), notes=document.getElementById('notes');
  let i=Math.max(0,Math.min(s.length-1,(parseInt(location.hash.replace('#',''),10)||1)-1));
  function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.forEach(x=>x.style.transform='translate(-50%,-50%) scale('+k+')');}
  function show(){s.forEach((x,j)=>x.classList.toggle('on',j===i));hud.textContent=(i+1)+' / '+s.length+'   ← → avanzar, N notas, F pantalla completa';notes.textContent=s[i].dataset.note||'(sin notas)';history.replaceState(null,'','#'+(i+1));
    s[i].querySelectorAll('.fade-up').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation='';});}
  addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){i=Math.min(s.length-1,i+1);show();e.preventDefault();}
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){i=Math.max(0,i-1);show();e.preventDefault();}
    else if(e.key==='Home'){i=0;show();} else if(e.key==='End'){i=s.length-1;show();}
    else if(e.key.toLowerCase()==='n'){notes.classList.toggle('on');}
    else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
  addEventListener('click',e=>{if(e.target.closest('a'))return;i=e.clientX<innerWidth/3?Math.max(0,i-1):Math.min(s.length-1,i+1);show();});
  addEventListener('resize',fit);fit();show();
})();
</script></body></html>
